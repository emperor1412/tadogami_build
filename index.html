<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | AutoRPGAdventure</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@telegram-apps/sdk@1.1.3/dist/index.iife.js"></script>
    <style>
        /* Reset all margins and paddings */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        /* Hide the footer with title and fullscreen button */
        #unity-footer {
            display: none !important;
        }
        
        /* Make the container take full screen */
        #unity-container {
            width: 100vw !important;
            height: 100vh !important;
            position: fixed !important;
            left: 0 !important;
            top: 0 !important;
            margin: 0 !important;
            padding: 0 !important;
            overflow: hidden !important;
        }
        
        /* Make the canvas take full screen */
        #unity-canvas {
            width: 100% !important;
            height: 100% !important;
            display: block !important;
        }
        
        /* Remove any margins or padding */
        body, html {
            margin: 0 !important;
            padding: 0 !important;
            overflow: hidden !important;
            width: 100% !important;
            height: 100% !important;
            position: fixed !important;
        }
        
        /* Ensure loading bar is centered */
        #unity-loading-bar {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
        }
    </style>
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
</head>
<body>
<div id="unity-container">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
            <div id="unity-progress-bar-full"></div>
        </div>
    </div>
    <div id="unity-warning"></div>
</div>

<script>
    console.log("Script started");
    
    var canvas = document.querySelector("#unity-canvas");
    var unityInstance = null;

    function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
            warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
            if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
            setTimeout(function () {
                warningBanner.removeChild(div);
                updateBannerVisibility();
            }, 5000);
        }
        updateBannerVisibility();
    }

    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/WebGL.loader.js";
    var config = {
        dataUrl: buildUrl + "/WebGL.data",
        frameworkUrl: buildUrl + "/WebGL.framework.js",
        codeUrl: buildUrl + "/WebGL.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "AutoRPGAdventure",
        productVersion: "1.0",
        showBanner: unityShowBanner,
    };

    // Set canvas size to match window dimensions
    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        console.log("Canvas resized to:", canvas.width, "x", canvas.height);
    }
    
    // Initial resize and add event listener for window resize
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    document.querySelector("#unity-loading-bar").style.display = "block";

    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = () => {
        console.log("Unity loader script loaded");
        
        createUnityInstance(canvas, config, (progress) => {
            console.log("Loading progress:", progress);
            document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
        }).then((instance) => {
            console.log("Unity instance created");
            unityInstance = instance;
            
            document.querySelector("#unity-loading-bar").style.display = "none";
            
            // Set fullscreen with device detection
            if (instance.SetFullscreen) {
                console.log("Checking device for fullscreen compatibility");
                // Check if device is iOS (iPad or iPhone)
                const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || 
                             (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
                
                if (isIOS) {
                    console.log("iOS device detected, skipping SetFullscreen call");
                    // For iOS devices, we rely on CSS fullscreen instead of the Unity fullscreen API
                } else {
                    console.log("Setting fullscreen mode");
                    try {
                        instance.SetFullscreen(1);
                    } catch (error) {
                        console.error("Error setting fullscreen:", error);
                    }
                }
            }

            // Wait for scene to load and send token
            setTimeout(() => {
                console.log("Attempting to send token after delay");
                try {
                    // Test connection first
                    unityInstance.SendMessage("WebGLBridge", "TestConnection");
                    console.log("Test connection successful");
                    
                    // Get and send token
                    const token = getLoginToken();
                    if (token) {
                        unityInstance.SendMessage("WebGLBridge", "OnLoginTokenReceived", token);
                        console.log("Token sent to Unity:", token);
                    } else {
                        unityInstance.SendMessage("WebGLBridge", "OnLoginTokenReceived", "");
                        console.log("No token found in URL, sending default");
                    }
                } catch (error) {
                    console.error("Error sending message to Unity:", error);
                }
            }, 2000);

        }).catch((message) => {
            console.error("Unity creation error:", message);
        });
    };

    document.body.appendChild(script);

    function getLoginToken() {
        console.log("Current URL:", window.location.href);
        const queryString = window.location.search.substring(1);
        console.log("Full query string:", queryString);
        
        if (queryString) {
            return queryString;
        }
        return null;
    }

    window.addEventListener('load', () => {
        console.log("Page loaded - URL:", window.location.href);
    });

    window.onerror = function(msg, url, line, col, error) {
        console.error("Global error:", {
            message: msg,
            url: url,
            line: line,
            column: col,
            error: error
        });
    };

    try {
        console.log("Telegram SDK available:", typeof telegramApps !== 'undefined');
        if (typeof telegramApps !== 'undefined') {
            console.log("Telegram SDK version:", telegramApps.sdk.version);
            try {
                const params = telegramApps.sdk.retrieveLaunchParams();
                console.log("Launch params available in HTML:", params);
            } catch (e) {
                console.error("Error retrieving launch params in HTML:", e);
            }
        }
    } catch (e) {
        console.error("Error checking Telegram SDK:", e);
    }
</script>
</body>
</html>
